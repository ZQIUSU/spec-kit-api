# 默认映射本机 3306→容器 3306。若本机 3306 已被占用：MYSQL_PUBLISH_PORT=3307 docker compose up -d
# 同时启动后端前需 export MYSQL_HOST_PORT=3307（与上面主机端口一致）
#
# 若已有数据卷且仍报 Access denied for root@172.x：在容器内执行 GRANT（见仓库 README）或 docker compose down -v 后重建（会丢库）。
services:
  mysql:
    image: mysql:8.0
    container_name: cream-login-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      # 宿主机或其它容器经 published port 连入时，客户端常显示为 172.*，需允许 root 非 localhost
      MYSQL_ROOT_HOST: '%'
      MYSQL_DATABASE: cream_login
    ports:
      - "${MYSQL_PUBLISH_PORT:-3306}:3306"
    volumes:
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
