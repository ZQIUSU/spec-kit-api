spring:
  application:
    name: cream-login-api
  datasource:
    # 整库 URL 用环境变量 SPRING_DATASOURCE_URL 覆盖；默认端口用 MYSQL_HOST_PORT（勿嵌套在 SPRING_DATASOURCE_URL 默认值内）。
    url: jdbc:mysql://127.0.0.1:${MYSQL_HOST_PORT:3306}/cream_login?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&characterEncoding=utf8
    username: ${DB_USERNAME:zqiusu}
    password: ${DB_PASSWORD:Dysdykjym1223@}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: 9080

# 指向前端仓库根目录（含 public/、src/assets/）；与前端同级时默认 ../my-first-front-project
app:
  frontend-assets:
    base-path: ${FRONTEND_ASSET_BASE:../my-first-front-project}
  # AES-GCM key material: SHA-256(UTF-8 bytes). Set APP_PASSWORD_RECOVERY_KEY in production.
  password-recovery:
    secret: ${APP_PASSWORD_RECOVERY_KEY:}